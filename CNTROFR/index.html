    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "Does CNTROFR sell my information or refer me to dealers?", "acceptedAnswer": { "@type": "Answer", "text": "Never. CNTROFR takes zero money from dealers, lenders, manufacturers, or advertising networks. We do not generate leads, sell your contact information, or refer you to any dealership. The moment we do that, the platform is worthless -- our entire value is that we work for you, not for them. Our only revenue comes from direct purchases by buyers like you." } },
        { "@type": "Question", "name": "Do you hate car salespeople?", "acceptedAnswer": { "@type": "Answer", "text": "Definitely not. Your salesperson is just that -- a person. If you like their vibe and they listen to your needs, stick with them and let them earn your business. In most cases, the overcharges and the greed don't go to the salesperson. That money goes to the folks in the suits, not the ones working long hours and holidays to move metal." } },
        { "@type": "Question", "name": "What does a good deal actually look like?", "acceptedAnswer": { "@type": "Answer", "text": "A great deal is good for both people at the table. CNTROFR exists to expose greed -- not to burn down the industry. If you walked out feeling respected, paid a fair price, and weren't loaded up with junk you didn't ask for -- that's a good deal. And if your salesperson made it happen, leave them a five-star review by name." } },
        { "@type": "Question", "name": "Why no subscription or app?", "acceptedAnswer": { "@type": "Answer", "text": "Simple -- use us when you need us. CNTROFR is built for the moment you're ready to make a large auto purchase, not something that needs to live on your phone year-round. Pay once, get what you need, go enjoy your new ride." } },
        { "@type": "Question", "name": "How do you protect my personal information?", "acceptedAnswer": { "@type": "Answer", "text": "We keep it minimal by design. While some information is necessary for payment processing, we'd rather not hold onto your personal data at all. CNTROFR exists to keep your money with you -- not to collect, sell, or monetize your information in any way." } },
        { "@type": "Question", "name": "Does CNTROFR work for used cars too?", "acceptedAnswer": { "@type": "Answer", "text": "Absolutely. Whether you're buying new off the lot or used from a dealer, the same tactics apply. One firm piece of advice: we do not recommend 'Buy Here, Pay Here' lots under any circumstances. Reputable dealers work with real financial institutions." } },
        { "@type": "Question", "name": "Can you help me find a vehicle?", "acceptedAnswer": { "@type": "Answer", "text": "That's not our lane. There are plenty of great marketplace tools out there for that part of the process. We're here once you've found the one you want and it's time to talk numbers." } },
        { "@type": "Question", "name": "What if the dealer won't budge?", "acceptedAnswer": { "@type": "Answer", "text": "Having the right information is powerful, but the dealership still has to agree to terms. If they won't move, be confident and walk. They are not the only game in town." } },
        { "@type": "Question", "name": "Is this legit for both new and used car dealerships?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Franchise dealers, independent lots, certified pre-owned programs -- the F&I playbook and the fee games are industry-wide. CNTROFR is built on insider knowledge from both sides of that desk." } },
        { "@type": "Question", "name": "Why is your Pro subscription only 7 days?", "acceptedAnswer": { "@type": "Answer", "text": "Simple -- if you're not ready to pull the trigger in 7 days, you're not prepared to make a purchase. Do your homework first, then come back when you're ready to move. No pressure, no recurring charges, no gotchas." } },
        { "@type": "Question", "name": "What should I spend all the money I saved on?", "acceptedAnswer": { "@type": "Answer", "text": "Honestly? You could save it for registration, insurance, or your first service appointment. But we'd probably spend it on sandwiches and video games. It's your money. Your choice. We just made sure it stayed yours." } },
        { "@type": "Question", "name": "This is my first time buying a car. Is CNTROFR for me?", "acceptedAnswer": { "@type": "Answer", "text": "Absolutely -- and we built something specifically for you. First time buyers are the most vulnerable in the dealership. Use our First Time Buyer tool before you go anywhere near a showroom." } },
        { "@type": "Question", "name": "Is CNTROFR for shoppers or buyers?", "acceptedAnswer": { "@type": "Answer", "text": "Buyers. If you're still deciding what you want, come back when you're ready to ink up. We're built for the person who knows what they want and is ready to go get it on fair terms." } },
        { "@type": "Question", "name": "I have a question that isn't answered here. How do I reach you?", "acceptedAnswer": { "@type": "Answer", "text": "Email us directly at info@cntrofr.com -- we respond to every message personally. You can also use the contact form on this page and we'll get back to you within 24 hours." } }
